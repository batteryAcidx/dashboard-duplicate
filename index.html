<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1322" />

    <!-- Private app: never index (also sent as an HTTP header in vercel.json) -->
    <meta name="robots" content="noindex, nofollow, noarchive" />

    <title>WedgeScale | Dashboard</title>
    <meta name="description" content="Log in to your WedgeScale dashboard." />

    <!-- Icons and manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="WedgeScale" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts used by the dashboard -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#0e1322] text-[#dee1f7] antialiased selection:bg-[#f59e0b]/30 selection:text-[#ffc174]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
